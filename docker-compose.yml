version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smart_recruitment_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: smart_recruitment
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smart_recruitment_redis
    restart: always
    ports:
      - "6379:6379"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: smart_recruitment_ai
    restart: always
    environment:
      PORT: 8000
      HOST: "0.0.0.0"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    ports:
      - "8000:8000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_recruitment_backend
    restart: always
    depends_on:
      - postgres
      - redis
      - ai-service
    environment:
      PORT: 5000
      JWT_SECRET: "smart_recruitment_super_secret_jwt_key_2026"
      AI_SERVICE_URL: "http://ai-service:8000"
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/smart_recruitment"
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_recruitment_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
